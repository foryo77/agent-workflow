name: 测试与安装验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.0.0', '20.x', '22.x', '24.x', '26.x']
    steps:
      - name: 获取源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 设置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: 运行同步测试与打包安装验证
        run: npm test
      - name: 检查发布文件清单
        run: npm run pack:check
